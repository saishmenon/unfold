<!doctype html><html><head><style>

<div class="hint">Drag Unfold into Applications</div>
<svg class="arrow" width="136" height="28" viewBox="0 0 136 28"><path d="M4 14 H124" stroke="#C9C3B5" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 9"/><path d="M116 6 L127 14 L116 22" fill="none" stroke="#C2613F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="card">
<h2><i></i>Opening Unfold for the first time</h2>
<div class="s"><div class="n">1</div><div>Open Unfold. macOS says it can’t verify it. Click <b>Done</b>.</div></div>
